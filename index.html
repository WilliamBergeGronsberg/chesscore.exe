<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download ChessCore Terminal Edition, a keyboard-driven chess game for Windows.">
  <title>ChessCore Terminal Edition</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Consolas, "Liberation Mono", monospace;
      background: #080d09;
      color: #c8d8cb;
      --green: #81ff98;
      --muted: #a0b6a4;
      --border: #365a3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      line-height: 1.6;
    }

    main {
      width: min(100%, 46rem);
      border: 1px solid var(--border);
      background: #101811;
    }

    .titlebar {
      margin: 0;
      padding: .55rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .8rem;
    }

    .screen {
      padding: clamp(1.25rem, 5vw, 3rem);
      text-align: center;
    }

    .board {
      margin: 0 0 1.25rem;
      color: var(--green);
      font: inherit;
      line-height: 1.15;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(1.8rem, 7vw, 3.75rem);
      line-height: 1.1;
      letter-spacing: .06em;
    }

    .edition {
      margin: .5rem 0 1.25rem;
      color: var(--green);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .download {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin-top: .5rem;
      padding: .65rem .9rem;
      border: 1px solid var(--green);
      background: #192e1d;
      color: var(--green);
      font-weight: bold;
      text-decoration: none;
    }

    .download:hover,
    .download:focus-visible {
      background: var(--green);
      color: #080d09;
    }

    .download:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 4px;
    }

    .hint {
      margin: .75rem 0 0;
      color: var(--muted);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="titlebar"><span aria-hidden="true">&gt; </span>ChessCore.exe</p>
    <div class="screen">
      <pre class="board" aria-hidden="true">┌───┬───┬───┐
│ ♜ │ ♞ │ ♝ │
├───┼───┼───┤
│ ○ │[♙]│   │
└───┴───┴───┘</pre>
      <h1>CHESSCORE</h1>
      <p class="edition">Terminal Edition</p>
      <p>Play chess in your terminal with just your keyboard.</p>
      <a class="download" href="./dist/ChessCore.exe" download>
        <span aria-hidden="true">&gt;</span> Download for Windows
      </a>
      <p class="hint">Standalone .exe &middot; No Python required</p>
    </div>
  </main>
</body>
</html>
